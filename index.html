<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b16"><meta name="description" content="SPIDY AI personal assistant mobile demo">
<link rel="manifest" href="manifest.json"><link rel="icon" href="spidy.svg" type="image/svg+xml">
<title>SPIDY AI</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar"><div class="brandmark">🕷</div><div class="brand"><h1>SPIDY <span>AI</span></h1><p>YOUR PERSONAL AI ASSISTANT</p></div><div class="online"><i></i> ONLINE</div></header>
  <main>
    <section class="hero"><div class="orbit orbit1"></div><div class="orbit orbit2"></div><div class="spider">🕷</div><h2>SPIDY AI</h2><p>ALWAYS HERE FOR YOU</p></section>
    <section class="quick"><div class="section-title">⚡ QUICK COMMANDS</div><div class="quick-grid">
      <button data-command="open google"><span class="qicon">G</span>Google</button><button data-command="open youtube"><span class="qicon youtube">▶</span>YouTube</button><button data-command="open spotify"><span class="qicon spotify">●</span>Spotify</button><button data-command="time"><span class="qicon">◷</span>Show time</button>
    </div></section>
    <section class="chat-panel"><div class="chat-head"><div class="mini-spider">🕷</div><div><b>SPIDY AI</b><small><i></i> Ready to help</small></div><button id="clear" class="clear">CLEAR</button></div><div id="messages" class="messages" aria-live="polite"></div>
      <div class="composer"><input id="prompt" placeholder="Type a message..." autocomplete="off"><button id="send" aria-label="Send message">➤</button></div>
    </section>
    <p class="note">MOBILE DEMO · Hindi + English · Tap a command to try it</p>
  </main>
  <nav class="bottom-nav"><button class="active" data-tab="Home">⌂<span>Home</span></button><button data-tab="Chat">▤<span>Chat</span></button><button id="voice">🎙<span>Voice</span></button><button data-tab="Tools">⚙<span>Tools</span></button></nav>
</div><script src="app.js"></script>
</body></html>
